[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ralph"
version = "0.1.0"
description = "Autonomous software development agent that iteratively builds projects"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Ralph Agent" }
]
dependencies = ["pyyaml>=6.0"]

[project.scripts]
ralph = "ralph:main"

[tool.setuptools]
packages = ["agents"]
py-modules = ["ralph", "hooks"]

[tool.setuptools.package-data]
agents = ["*.py"]

