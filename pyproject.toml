[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyralph"
version = "0.1.0"
description = "Autonomous software development agent that iteratively builds projects"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    { name = "Ralph Agent" }
]
dependencies = ["pyyaml>=6.0"]
keywords = ["ai", "agent", "automation", "cli", "development", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/pavalso/pyralph"
Repository = "https://github.com/pavalso/pyralph"
Documentation = "https://github.com/pavalso/pyralph#readme"

[project.scripts]
ralph = "pyralph.ralph:main"
fetch-issues = "pyralph.fetch_ready_issues:main"
ralph-watch = "pyralph.fetch_ready_issues:watcher_main"
ralph-batch = "pyralph.fetch_ready_issues:batch_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.coverage.run]
source = ["src/pyralph"]
omit = [
    "tests/*",
    "venv/*",
    "venv/**",
    ".venv/*",
    ".venv/**",
]
relative_files = true

[tool.coverage.report]
fail_under = 48
show_missing = true
omit = [
    "tests/*",
    "venv/*",
    "venv/**",
    ".venv/*",
    ".venv/**",
]

[tool.coverage.xml]
output = "coverage.xml"
